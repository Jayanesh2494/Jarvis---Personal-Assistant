  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <circle cx="96" cy="96" r="68" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.8"/>
