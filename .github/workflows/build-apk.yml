name: Build JARVIS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' ./android-app/gradlew || true
          chmod +x ./android-app/gradlew || true

      - name: Build Debug APK
        run: |
          cd android-app
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log || {
            echo "## ❌ Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "## ✅ Gradle Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "### Generated APK Files:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          mkdir -p ../dist
          find . -name "*.apk" -exec cp -v {} ../dist/ \; || true
          ls -la ../dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: dist/*.apk
          retention-days: 14
