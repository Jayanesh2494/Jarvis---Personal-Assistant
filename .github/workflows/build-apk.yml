name: Build JARVIS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' ./android-app/gradlew || true
          chmod +x ./android-app/gradlew || true

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew :app:assembleDebug --stacktrace
          mkdir -p "$RUNNER_TEMP/apk_output"
          find . -name "*.apk" -exec cp -v {} "$RUNNER_TEMP/apk_output/" \;
          ls -la "$RUNNER_TEMP/apk_output/"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: ${{ runner.temp }}/apk_output/*.apk
          retention-days: 14
