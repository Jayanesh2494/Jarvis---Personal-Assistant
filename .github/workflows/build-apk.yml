name: Build JARVIS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' ./android-app/gradlew || true
          chmod +x ./android-app/gradlew || true

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          find . -name "*.apk"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: '**/*.apk'
          retention-days: 14

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android-app/gradle-build.log
          retention-days: 7
